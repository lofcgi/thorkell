[project]
name = "thorkell"
version = "0.1.0"
description = "Thorkell brain: an autonomous, conversational Valheim companion"
requires-python = ">=3.13,<3.14"
dependencies = [
    "google-genai>=2.26",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "sounddevice>=0.5.6",
]

[project.scripts]
thorkell = "thorkell.ops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thorkell"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["thorkell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[[tool.mypy.overrides]]
module = ["sounddevice"]
ignore_missing_imports = true
